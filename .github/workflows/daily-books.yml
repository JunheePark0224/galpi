# D-B daily book pipeline (docs/plans/2026-10-01-d-stage-design.md 2-1, plan 2026-10-01-d-b-daily-pipeline.md).
# 06:00 KST every day + by hand (dry_run: everything but the PR). One PR per day, and only one open at a time —
# books.json would conflict between stacked PRs, so a day with an earlier books/ PR still open is skipped. A day that is
# already on main, or whose books/<date> branch is left over, is skipped too — before any API call is paid for.
# By hand with next_batch (10-05, launch fill): another batch the same day, id <date>-2, -3 … (src/pipeline/batch.py) — the
# next number with no additions file on main and no books/ branch. Still one open books/ PR at a time; the schedule is as before.
# YES24 book text only reaches the tagger in memory: nothing below prints, uploads or commits it.
# The two API keys are given to ONE step (Tag today's books) and are never echoed; ANTHROPIC_LOG stays unset (debug
# logging would print request bodies, which hold YES24 text).
# Token scopes: none by default, `gate` reads, only `books` writes; the checkout keeps no token on disk while npm ci and
# the SDK run, and the push step logs in by itself.
name: daily-books

on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 06:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but open no PR"
        type: boolean
        default: true
      count:
        description: "Books today (empty = daily_count in data/pipeline/config.json)"
        type: string
        default: ""
      next_batch:
        description: "Another batch today (<date>-2, -3 …) even when today's books are already on main"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: daily-books
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  NEXT_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.next_batch }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      date: ${{ steps.day.outputs.date }}
      batch: ${{ steps.day.outputs.batch }}
      go: ${{ steps.day.outputs.go }}
    steps:
      - name: Batch id code (next_batch only, no token kept)
        if: env.NEXT_BATCH == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: src/pipeline
      - name: Day (KST), open books/ PRs, today already done, batch id
        id: day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=Asia/Seoul date +%F)
          echo "date=$day" >> "$GITHUB_OUTPUT"
          skip() {
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "$1 Skipped today (no API calls)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$DRY_RUN" != "true" ]; then
            open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("books/"))] | length')
            [ "$open" = "0" ] || skip "A books/ PR is still open — review and merge it first."
          fi
          if [ "$NEXT_BATCH" = "true" ]; then
            # the next free batch of today: after every additions file of today on main and every books/<day>… branch
            files=$(gh api "repos/$GITHUB_REPOSITORY/contents/data/processed/additions?ref=main" --jq '.[].name')
            branches=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/books/$day" --jq '.[].ref')
            batch=$(python3 -m src.pipeline.batch next --date "$day" $files $branches)
          else
            batch=$day
            if [ "$DRY_RUN" != "true" ]; then
              if gh api "repos/$GITHUB_REPOSITORY/contents/data/processed/additions/$day.json?ref=main" > /dev/null 2>&1; then
                skip "Today's books ($day) are already on main. (Another batch today: run by hand with next_batch.)"
              fi
              if gh api "repos/$GITHUB_REPOSITORY/branches/books/$day" > /dev/null 2>&1; then
                skip "A books/$day branch is left over from an earlier run — merge or close its PR and delete the branch first."
              fi
            fi
          fi
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
          echo "Batch: $batch" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "go=true" >> "$GITHUB_OUTPUT"

  books:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      PYTHONIOENCODING: utf-8
      BATCH: ${{ needs.gate.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Python deps and tests
        run: |
          pip install -r requirements.txt
          python -m pytest src/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web deps
        working-directory: web
        run: npm ci

      - name: Tag today's books
        id: run
        env:
          YES24_API_KEY: ${{ secrets.YES24_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ inputs.count }}
        run: |
          python -m src.pipeline.run_daily --batch "$BATCH" ${COUNT:+--count "$COUNT"}
          # only a run that wrote this batch's file counts (an existing file makes run_daily do nothing and leaves no summary)
          status=$(jq -r .status "data/pipeline/runs/$BATCH.json" 2>/dev/null || true)
          if [ "$status" = "ok" ] || [ "$status" = "partial" ]; then echo "added=true" >> "$GITHUB_OUTPUT"; fi

      - name: Import into books.json and test the app data
        if: steps.run.outputs.added == 'true'
        working-directory: web
        run: npm run books:import && npm test

      - name: PR body
        if: steps.run.outputs.added == 'true'
        run: |
          python -m src.pipeline.report --batch "$BATCH" --out "$RUNNER_TEMP/pr.md"
          cat "$RUNNER_TEMP/pr.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the dry run's result (our tags only)
        if: steps.run.outputs.added == 'true' && env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ needs.gate.outputs.batch }}
          path: |
            data/processed/additions/${{ needs.gate.outputs.batch }}.json
            data/pipeline/runs/${{ needs.gate.outputs.batch }}.json
          retention-days: 7

      - name: Open the PR (merge it too when auto_merge is true)
        if: steps.run.outputs.added == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="books/$BATCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "$branch"
          git add "data/processed/additions/$BATCH.json" web/src/data/books.json web/src/data/vocab.json web/src/data/library.json web/src/data/mood-skips.json
          git commit -m "data: daily books $BATCH"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "오늘의 새 책 $BATCH" --body-file "$RUNNER_TEMP/pr.md"
          if [ "$(jq -r .auto_merge data/pipeline/config.json)" = "true" ]; then
            merged=false
            for i in 1 2 3; do
              if gh pr merge "$branch" --squash --delete-branch; then merged=true; break; fi
              sleep 15
            done
            # a PR that stays open would make the gate skip every following day: fail loudly instead
            [ "$merged" = "true" ] || { echo "::error::auto-merge of $branch failed 3 times — merge it by hand"; exit 1; }
          fi
