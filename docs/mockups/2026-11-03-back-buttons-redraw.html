<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>뒤표지 버튼 C-1 다시 뽑기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF5EA;--ink:#2B2724;--ink-soft:#4a433d;--ink-muted:#7a6f66;--cloth:#7A4A2E;--foil:#EAD9B0}
*{box-sizing:border-box}
body{margin:0;background:#efe7d6;font-family:'Gowun Dodum',sans-serif;color:var(--ink);padding:24px 16px}
h1{font-family:'Gowun Batang',serif;font-size:18px;text-align:center;margin:0 0 6px}
.sub{text-align:center;font-size:13px;color:var(--ink-muted);margin:0 0 20px}
.wrap{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.col{width:320px;max-width:100%}
.tag{font-size:14px;font-weight:700;font-family:'Gowun Batang',serif;margin:0 0 2px;text-align:center}
.why{font-size:12px;color:var(--ink-muted);margin:0 0 10px;text-align:center;min-height:32px}
.phone{background:var(--paper);border-radius:22px;padding:0 0 22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.book{height:150px;margin:0 22px;background:var(--cloth);border-radius:0 0 10px 2px;position:relative;
  background-image:radial-gradient(rgba(250,245,234,.12) .8px,transparent 1.2px);background-size:5px 5px;box-shadow:0 18px 30px -16px rgba(43,39,36,.45)}
.book::after{content:"";position:absolute;top:0;right:0;bottom:0;width:22px;background:#4f2d1c;border-radius:0 0 10px 0}
.label{position:absolute;left:18px;right:40px;bottom:20px;background:#faf7ee;border-radius:6px;padding:8px;text-align:center;font-size:11px;color:var(--ink-muted)}
.label b{display:block;font-family:'Gowun Batang',serif;font-size:13px;color:var(--ink);margin-bottom:2px}
.actions{display:flex;gap:10px;width:272px;margin:36px auto 0}
button{font:inherit;cursor:pointer;border:0;padding:0;position:relative}
.t{flex:1;min-height:96px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;line-height:1.35}
.t.p{flex:1.5}
.ic{width:26px;height:26px}
small{font-size:12px;opacity:.8}
.p{background:var(--ink);color:var(--paper);box-shadow:0 4px 0 #120f0d,0 10px 18px -8px rgba(43,39,36,.55)}
.p::before{content:"";position:absolute;inset:5px;border:1px solid rgba(234,217,176,.55);border-radius:11px}
.p .ic{color:var(--foil)}
.s{background:#fffdf7;color:var(--ink);border:1.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.share{display:flex;align-items:center;justify-content:center;gap:5px;margin:14px auto 0;min-height:44px;background:none;color:var(--ink-muted);font-size:13px;
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:#c9b48f}
.share .ic{width:15px;height:15px}
</style></head><body>
<h1>뒤표지 버튼 — C-1 + 다시 뽑기</h1>
<p class="sub">공유는 작은 밑줄 글씨로 · 다시 뽑기 = 같은 답으로 새 책갈피 5장(이미 본 책 빼고)</p>
<div class="wrap">
 <div class="col"><p class="tag">궁금해요 1권 이상</p><p class="why">주 버튼 [책 정보 보기] + 보조 [다시 뽑기]</p>
  <div class="phone"><div class="book"><div class="label"><b>내가 고른 길</b>이 길에서 만난 책갈피 5장</div></div>
   <div class="actions">
    <button class="t p"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>책 정보 보기<small>궁금해요 2권</small></button>
    <button class="t s"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>다시 뽑기<small>새 책갈피 5장</small></button>
   </div>
   <button class="share"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/></svg>결과 공유하기</button>
  </div></div>

 <div class="col"><p class="tag">궁금해요 0권</p><p class="why">[다음 책갈피 만나기] 대신 [다시 뽑기] 하나가 주 버튼</p>
  <div class="phone"><div class="book"><div class="label"><b>내가 고른 길</b>이 길에서 만난 책갈피 5장</div></div>
   <div class="actions">
    <button class="t p"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>다시 뽑기<small>새 책갈피 5장</small></button>
   </div>
   <button class="share"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/></svg>결과 공유하기</button>
  </div></div>
</div>
</body></html>
