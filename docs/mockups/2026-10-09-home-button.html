<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>처음으로 버튼 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF5EA;--paper-deep:#F0E6D0;--paper-line:#DDD0B4;--ink:#2B2724;--ink-soft:#4A433D;--ink-muted:#7A6048;--cloth:#7A4A2E}
body{margin:0;padding:24px;background:#E9E1CF;font-family:"Gowun Dodum",sans-serif;color:var(--ink)}
.grid{display:flex;gap:22px}
.col{width:375px}
.tag{font-family:"Gowun Batang",serif;font-size:18px;margin:0 0 4px}
.desc{font-size:12px;color:var(--ink-muted);margin:0 0 10px;min-height:54px;line-height:1.5}
.phone{position:relative;width:375px;height:667px;border-radius:18px;overflow:hidden;background:url(2026-10-09-home-base.png) top left/375px auto no-repeat;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.pillA{position:absolute;left:84px;top:13px;height:28px;display:flex;align-items:center;gap:4px;padding:0 10px;border:1px solid var(--paper-line);border-radius:9999px;background:#fffdf8;font-size:12.5px;color:var(--ink-soft)}
.capB{position:absolute;left:18px;top:42px;font-size:10.5px;color:var(--ink-muted);letter-spacing:.02em}
.capB::before{content:"";position:absolute;left:0;right:0;top:-2px;border-top:1px solid var(--paper-line)}
.homeC{position:absolute;left:84px;top:12px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:9999px;color:var(--ink-soft);font-size:17px}
.homeC small{position:absolute;top:30px;font-size:9.5px;white-space:nowrap;color:var(--ink-muted)}
.cover{position:absolute;right:12px;top:8px;width:110px;height:38px;background:#F7F1E4}
.rightD{position:absolute;right:16px;top:12px;height:30px;display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--ink-soft)}
.rightD span{border-bottom:1px solid var(--paper-line);padding-bottom:3px}
.rightE{position:absolute;right:16px;top:12px;height:30px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.rightE .pill{display:flex;align-items:center;gap:3px;padding:3px 10px;border:1px solid var(--paper-line);border-radius:9999px;background:#fffdf8}
.rightE .acct{border-bottom:1px solid var(--paper-line);padding-bottom:3px}
.note{position:absolute;left:0;right:0;top:0;height:52px;outline:2px dashed #5E8A5A;outline-offset:-2px;border-radius:18px 18px 0 0;pointer-events:none}
</style></head><body>
<div class="grid">
 <div class="col"><p class="tag">A · 로고 옆 [⌂ 처음으로]</p><p class="desc">왼쪽 로고 옆. 로고와 짝이라 "처음"이 직관적</p>
  <div class="phone"><span class="pillA">⌂ 처음으로</span><div class="note"></div></div></div>
 <div class="col"><p class="tag">D · 로그인 옆 글자 (오른쪽 모음)</p><p class="desc">누르는 것은 모두 오른쪽. 로그인과 같은 모양의 밑줄 글자라 정돈됨</p>
  <div class="phone"><div class="cover"></div><div class="rightD"><span>처음으로</span><span>로그인</span></div><div class="note"></div></div></div>
 <div class="col"><p class="tag">D′ · 로그인 옆 알약</p><p class="desc">오른쪽에 두되 [⌂ 처음으로]만 알약으로 — 버튼인 게 더 잘 보임</p>
  <div class="phone"><div class="cover"></div><div class="rightE"><span class="pill">⌂ 처음으로</span><span class="acct">로그인</span></div><div class="note"></div></div></div>
 <div class="col"><p class="tag">D · 로그인한 뒤 (가장 긴 경우)</p><p class="desc">"내 책갈피 10"과 함께 — 320px 폰에서도 한 줄에 들어가는지</p>
  <div class="phone"><div class="cover"></div><div class="rightD"><span>처음으로</span><span>내 책갈피 10</span></div><div class="note"></div></div></div>
</div>
</body></html>
