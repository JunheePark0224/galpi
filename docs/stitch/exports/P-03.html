<script>
  // Simple interaction for chip selection
  document.querySelectorAll('[data-chip-group]').forEach(group => {
    const buttons = group.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.className = 'h-touch-target px-space-md rounded-full bg-surface-container-low text-on-surface-soft font-label-md text-label-md shadow-sm transition-all active:scale-95';
        });
        btn.className = 'h-touch-target px-space-md rounded-full bg-primary-container text-surface-bright font-label-md text-label-md font-medium shadow-md transition-all active:scale-95';
      });
    });
  });

  // Toggle custom topic box on chip click
  const customChip = document.getElementById('custom-topic-chip');
  const customBox = document.getElementById('custom-topic-box');
  const otherTopicChips = document.querySelectorAll('#interest-chips .interest-chip:not(#custom-topic-chip)');

  otherTopicChips.forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('bg-primary-container');
      chip.classList.toggle('text-surface-bright');
      chip.classList.toggle('bg-surface-container-low');
      chip.classList.toggle('text-on-surface-soft');
    });
  });

  customChip.addEventListener('click', () => {
    const isHidden = customBox.classList.contains('hidden');
    if (isHidden) {
      customBox.classList.remove('hidden');
      customChip.classList.add('bg-primary-container', 'text-surface-bright');
      customChip.classList.remove('bg-surface-container-low', 'text-on-surface-soft');
    } else {
      customBox.classList.add('hidden');
      customChip.classList.remove('bg-primary-container', 'text-surface-bright');
      customChip.classList.add('bg-surface-container-low', 'text-on-surface-soft');
    }
  });
