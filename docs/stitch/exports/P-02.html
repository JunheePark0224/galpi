<script>
  (function() {
    const holdBtn = document.getElementById('holdButton');
    const progressBar = document.getElementById('holdProgress');
    let timer = null;
    let progress = 32;

    const startHold = () => {
      progress = 32;
      progressBar.style.width = progress + '%';
      timer = setInterval(() => {
        progress += 4;
        if (progress >= 100) {
          progress = 100;
          progressBar.style.width = '100%';
          clearInterval(timer);
          setTimeout(() => {
            progressBar.style.width = '32%';
            progress = 32;
          }, 400);
        } else {
          progressBar.style.width = progress + '%';
        }
      }, 30);
    };

    const cancelHold = () => {
      if (timer) clearInterval(timer);
      progress = 32;
      progressBar.style.width = '32%';
    };

    if (holdBtn) {
      holdBtn.addEventListener('mousedown', startHold);
      holdBtn.addEventListener('touchstart', startHold, { passive: true });
      holdBtn.addEventListener('mouseup', cancelHold);
      holdBtn.addEventListener('mouseleave', cancelHold);
      holdBtn.addEventListener('touchend', cancelHold);
    }
  })();
